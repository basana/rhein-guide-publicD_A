<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6EEDD">
<title>Map Navi — Prototype 0.1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--paper:#f6eedf;--paper2:#eadbbd;--ink:#463722;--muted:#7d6b50;--gold:#bd9855;--terra:#a84f2b;--green:#6d7f43;--blue:#386c91}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:12px 14px 9px;border-bottom:1px solid var(--gold);background:var(--paper)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:600 22px/1.1 Georgia,serif;margin:0;color:#7a1026}
#status{font-size:11px;color:var(--muted);text-align:right}
#search{width:100%;margin-top:10px;padding:11px 13px;border:1px solid var(--gold);border-radius:11px;background:#fffdf8;color:var(--ink);font-size:16px}
.categories{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
button{font:600 13px system-ui,-apple-system,sans-serif;border:1px solid var(--gold);border-radius:10px;background:var(--paper2);color:var(--ink);padding:9px 12px;white-space:nowrap}
button.active{background:var(--terra);border-color:var(--terra);color:#fff8ec}
button:disabled{opacity:.45}
main{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;padding:8px 10px 10px}
#map{flex:1;min-height:38vh;border:1px solid var(--gold);border-radius:13px;overflow:hidden;position:relative}\n.map-reset-control{position:absolute;z-index:1000;top:14px;right:14px;width:46px;height:46px;display:grid;place-items:center;padding:0;border:1px solid #bd9855;border-radius:50%;background:#fffdf4;color:#463722;box-shadow:0 2px 10px #46372233;cursor:pointer}\n.map-reset-control svg{width:25px;height:25px;display:block}\n.map-reset-control:active{transform:scale(.96)}\n.map-reset-control:focus-visible{outline:3px solid #386c91;outline-offset:2px}
.controls{display:flex;gap:7px;flex-wrap:wrap}
.controls button{flex:1;min-width:100px}
#objectCount{font-size:11px;color:var(--muted);padding:0 2px}
#results{display:flex;gap:7px;overflow-x:auto;min-height:38px;scrollbar-width:none}
#results::-webkit-scrollbar{display:none}
.result-chip{font-size:12px;padding:8px 10px}
.empty{font-size:12px;color:var(--muted);padding:9px}
.card{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px;background:var(--paper2);border:1px solid var(--gold);border-radius:12px;max-height:24vh;overflow:auto}
.card.empty-card{display:block}
#objectImage{width:86px;height:86px;object-fit:cover;border-radius:8px;border:1px solid var(--gold)}
#objectTitle{font:600 18px/1.15 Georgia,serif;margin:0 0 4px;color:var(--terra)}
#objectMeta,#objectDistance{font-size:11px;color:var(--muted);margin:0 0 4px}
.say{font-size:12px;line-height:1.35;margin:5px 0 0}
.say b{color:var(--terra);font-size:10px;letter-spacing:.04em}
.user-dot{width:18px;height:18px;border-radius:50%;background:#1676d2;border:3px solid #fff;box-shadow:0 0 0 5px #1676d244}
.leaflet-container{font:12px system-ui,-apple-system,sans-serif}
@media(min-width:760px){main{max-width:1100px;width:100%;margin:0 auto}#map{min-height:55vh}.card{max-height:220px}}
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>Map Navi · Core 0.1</h1>
    <div id="status">Загрузка профиля…</div>
  </div>
  <input id="search" type="search" placeholder="Найти замок, город или место…" autocomplete="off">
  <div class="categories">
    <button type="button" data-category="all" class="active">Все объекты</button>
    <button type="button" data-category="castle">Замки</button>
    <button type="button" data-category="town">Города</button>
    <button type="button" data-category="landmark">Достопримечательности</button>
  </div>
</header>
<main>
  <div id="map" aria-label="Карта Среднего Рейна"><button id="mapResetButton" class="map-reset-control" type="button" aria-label="Показать всю карту" title="Показать всю карту"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 15v5h-5"/><path d="M4.8 8a8 8 0 0 1 13.1-2.1L20 8"/><path d="M19.2 16a8 8 0 0 1-13.1 2.1L4 16"/></svg></button></div>
  <div class="controls">
    <button id="gpsButton" type="button">Включить GPS</button>
    <button id="followButton" type="button" disabled>Вернуться к Follow</button>
    <button id="fullMapButton" type="button">Вся карта ↔</button>
  </div>
  <div id="objectCount">Объектов: —</div>
  <div id="results" aria-label="Результаты"></div>
  <section id="objectCard" class="card">
    <img id="objectImage" alt="" hidden>
    <div>
      <h2 id="objectTitle">Загрузка…</h2>
      <p id="objectMeta"></p>
      <p id="objectDistance"></p>
      <p class="say"><b>SAY THIS · EN</b><br><span id="sayEn"></span></p>
      <p class="say"><b>ТЕКСТ · RU</b><br><span id="sayRu"></span></p>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module" src="./app.mjs"></script>
</body>
</html>
